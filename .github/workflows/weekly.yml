name: weekly

on:
  schedule:
    # Monday 08:30 JST = Sunday 23:30 UTC
    - cron: '30 23 * * 0'
  workflow_dispatch:
    inputs:
      date:
        description: 'レポート対象の週末日 (YYYY-MM-DD、空なら当日JST)'
        required: false
        default: ''
      skip_ahrefs:
        description: 'Ahrefs取得をスキップして週次所見だけ再生成する'
        type: boolean
        required: false
        default: false

permissions:
  contents: write      # data/reports/ のcommitに必要

concurrency:
  group: llmo-weekly
  cancel-in-progress: false

jobs:
  weekly:
    runs-on: ubuntu-latest
    env:
      GCP_SERVICE_ACCOUNT_JSON: ${{ secrets.GCP_SERVICE_ACCOUNT_JSON }}
      SHEETS_SPREADSHEET_ID: ${{ secrets.SHEETS_SPREADSHEET_ID }}
      AHREFS_API_KEY: ${{ secrets.AHREFS_API_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run weekly pipeline (Ahrefs -> rules -> insight -> Slack)
        working-directory: src
        run: |
          python run_weekly.py \
            ${{ inputs.date && format('--date {0}', inputs.date) || '' }} \
            ${{ inputs.skip_ahrefs && '--skip-ahrefs' || '' }}

      - name: Commit weekly stats.json
        if: always()
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/reports
          if git diff --cached --quiet; then
            echo "No new weekly stats to commit."
          else
            git commit -m "data: weekly stats $(date -u +%Y-%m-%d)"
            git push
          fi

      - name: Report failure
        if: failure()
        run: echo "::warning::One or more weekly pipeline phases failed — see the job summary."

      # Catches failures that never reach notify_slack.py (checkout, pip install,
      # a crash before the Python delivery phase).
      - name: Notify Slack on workflow failure
        if: failure() && env.SLACK_WEBHOOK_URL != ''
        run: |
          RUN_URL="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          TEXT="*LLMO週次アラート*\n*❌ ワークフロー失敗*\n• weekly.yml が異常終了しました(週次所見が未配信の可能性あり)\n<$RUN_URL|実行ログを開く>"
          printf '{"text":"%s"}' "$TEXT" > payload.json
          curl -sS -X POST -H 'Content-type: application/json' \
            --data @payload.json "$SLACK_WEBHOOK_URL" > /dev/null
