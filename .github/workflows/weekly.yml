name: weekly

on:
  schedule:
    # Monday 08:30 JST = Sunday 23:30 UTC
    - cron: '30 23 * * 0'
  workflow_dispatch:
    inputs:
      date:
        description: 'レポート対象の週末日 (YYYY-MM-DD、空なら当日JST)'
        required: false
        default: ''
      skip_ahrefs:
        description: 'Ahrefs取得をスキップして週次所見だけ再生成する'
        type: boolean
        required: false
        default: false

permissions:
  contents: write      # data/reports/ のcommitに必要

concurrency:
  group: llmo-weekly
  cancel-in-progress: false

jobs:
  weekly:
    runs-on: ubuntu-latest
    env:
      GCP_SERVICE_ACCOUNT_JSON: ${{ secrets.GCP_SERVICE_ACCOUNT_JSON }}
      SHEETS_SPREADSHEET_ID: ${{ secrets.SHEETS_SPREADSHEET_ID }}
      AHREFS_API_KEY: ${{ secrets.AHREFS_API_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}   # 週次所見は 2026-10-06 から Gemini
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run weekly pipeline (Ahrefs -> rules -> insight -> Slack)
        id: pipeline
        working-directory: src
        run: |
          python run_weekly.py \
            ${{ inputs.date && format('--date {0}', inputs.date) || '' }} \
            ${{ inputs.skip_ahrefs && '--skip-ahrefs' || '' }}

      # LLMO効果測定（〜2026-12-31）。47本の本文が処置以外の理由で変わっていないかを
      # 毎週確かめる。変化があった週だけ output/reports/experiment47_drift_*.md が出る。
      # 失敗しても週次パイプライン本体は落とさない（観測の付随情報のため）。
      - name: Check experiment article drift
        if: always()
        continue-on-error: true
        run: python experiment_2x2/drift_check.py

      # LLMO効果測定の週次集計。前の週(月〜日)の llm_experiment を
      # output/reports/experiment47_weekN_YYYYMMDD.md に書く(下の commit に含まれる)。
      # 失敗しても週次パイプライン本体は落とさない。
      - name: Build experiment weekly summary
        if: always()
        continue-on-error: true
        working-directory: src
        run: |
          python experiment_weekly.py \
            ${{ inputs.date && format('--date {0}', inputs.date) || '' }}

      - name: Commit weekly stats.json
        id: commit
        if: always()
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/reports experiment_2x2/drift output/reports
          if [ -d data/claude_usage ]; then git add data/claude_usage; fi  # Claude の1日の呼び出し回数
          if git diff --cached --quiet; then
            echo "No new weekly stats to commit."
          else
            git commit -m "data: weekly stats $(date -u +%Y-%m-%d)"
            # 定時より遅れて走ると(2026-09-28 は08:30の予定が10:50)、drift_check の
            # 2分強の間に experiment.yml 等の push が入り non-fast-forward で弾かれる。
            # 触るパスは重ならないので、取り込んでから送る。
            git pull --rebase
            git push
          fi

      # Claude API の1日の呼び出し上限・クレジット不足(claude_budget。2026-10-03)。
      # 止まっていたら失敗にして Slack に知らせる(記録の commit のあと。Gemini の観測には影響しない)。
      - name: Check Claude daily cap
        if: always()
        working-directory: src
        run: python claude_budget.py --check --job weekly

      - name: Report failure
        if: failure()
        run: echo "::warning::One or more weekly pipeline phases failed — see the job summary."

      # Catches failures that never reach notify_slack.py (checkout, pip install,
      # a crash before the Python delivery phase) and failures after delivery
      # (commit/push). 所見が届いたかは run_weekly.py の出力(delivered)で分ける。
      - name: Notify Slack on workflow failure
        if: failure() && env.SLACK_WEBHOOK_URL != ''
        env:
          DELIVERED: ${{ steps.pipeline.outputs.delivered }}
          FAILED_PHASES: ${{ steps.pipeline.outputs.failed_phases }}
          COMMIT_CONCLUSION: ${{ steps.commit.conclusion }}
        run: |
          RUN_URL="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          PHASES="$FAILED_PHASES"
          if [ "$COMMIT_CONCLUSION" = "failure" ]; then
            PHASES="${PHASES:+$PHASES, }commit(git push)"
          fi
          if [ "$DELIVERED" = "true" ]; then
            DETAIL="• weekly.yml が異常終了しました(週次所見は配信済み)\n• 落ちたフェーズ: ${PHASES:-不明}"
          else
            DETAIL="• weekly.yml が異常終了しました(週次所見が未配信の可能性あり)"
            if [ -n "$PHASES" ]; then
              DETAIL="$DETAIL\n• 落ちたフェーズ: $PHASES"
            fi
          fi
          TEXT="*LLMO週次アラート*\n*❌ ワークフロー失敗*\n$DETAIL\n<$RUN_URL|実行ログを開く>"
          printf '{"text":"%s"}' "$TEXT" > payload.json
          curl -sS -X POST -H 'Content-type: application/json' \
            --data @payload.json "$SLACK_WEBHOOK_URL" > /dev/null
