name: experiment

on:
  schedule:
    # LLMO効果測定実験。何を回すかは settings.experiment_plan が日付から決める。
    # Gemini は47本を輪にして、開始日(EXPERIMENT_CYCLE_START)から毎日
    # その日の本数だけ進める。月水金日は16本(余り4)。
    # **2026-10-17 から日次・月次を一時停止中(config/observation_pause.yaml)。停止中は7日とも14本(予備6・週98本)で、
    # 日次・月次の完了は待たない。** 下の火木土・月次の日の扱いは再開したときのもの。
    # 火木土と月次の日(第1水・第1木)は **日次・月次の完了を待ってから**、
    # 20 − 日次・月次の実消費(再試行込み)− 予備2。
    # cron は2時間近く遅れることがあり、08:00 の実験が 07:00 の日次より先に始まりうる。
    # run_experiment が origin の data/raw/<日付>・data/raw/monthly/<日付> を最大90分ポーリングし、揃わなければ
    # その日の Gemini は投げずに欠測(skipped)として記録する。
    # 曜日ごとのID範囲は持たないので、ここに書き写す表も無い。
    # Claude は 月・木 に47本(Gemini の枠と無関係)。**2026-10-05 から月曜のみ**(費用削減・settings.experiment_claude_weekdays)。
    # 08:00 JST = 前日 23:00 UTC。毎日走る。
    # 日次(07:00 JST)・月次(07:30 JST)のあとに走らせ、git push がぶつからないようにする。
    - cron: '0 23 * * *'
  workflow_dispatch:
    inputs:
      date:
        description: '観測日 (YYYY-MM-DD、空なら当日JST)。日付で観測する本数と割当が決まる'
        required: false
        default: ''

permissions:
  contents: write      # data/raw/experiment/ と実験日誌のcommitに必要

concurrency:
  group: llmo-experiment
  cancel-in-progress: false

jobs:
  # 日次・月次の完了待ち(2026-10-06 に観測のジョブから分けた)。API は呼ばず、origin を見て待つだけ。
  # 観測のジョブを1時間で打ち切れるようにするため(10/05 は Gemini の応答待ちで4時間止まり、気づくのが遅れた)。
  wait:
    runs-on: ubuntu-latest
    timeout-minutes: 100   # 日次・月次待ち(最大90分)+ 準備
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Wait for the daily and monthly Gemini runs
        working-directory: src
        run: |
          python run_experiment.py --wait-only \
            ${{ inputs.date && format('--date {0}', inputs.date) || '' }}

  experiment:
    needs: wait
    if: ${{ !cancelled() }}   # 待ちのジョブが落ちても観測はする(観測のジョブがもう一度短く待つ)
    runs-on: ubuntu-latest
    # 観測だけの制限時間(2026-10-06:4時間→1時間)。月曜の Gemini 16本 + Claude 47本で約30分。
    # Gemini の1回の呼び出しは180秒で打ち切って取り直す(collect_llm)ので、止まっても1時間で気づける
    timeout-minutes: 60
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      GCP_SERVICE_ACCOUNT_JSON: ${{ secrets.GCP_SERVICE_ACCOUNT_JSON }}
      SHEETS_SPREADSHEET_ID: ${{ secrets.SHEETS_SPREADSHEET_ID }}
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
      # 待ちは前のジョブで済ませてある。ここでは短く確かめ直すだけ(揃わなければ従来どおり Gemini を投げずに記録)
      EXPERIMENT_DAILY_WAIT_MINUTES: '10'
    steps:
      # 観測ジョブの時間の予算(2026-10-08・config/experiment_job.yaml の40分)の起点。実験と prompt_marketing が同じ締め切りを使う
      - name: Record the job start time
        run: echo "EXPERIMENT_JOB_STARTED_AT=$(date +%s)" >> "$GITHUB_ENV"

      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run experiment observation
        id: observe
        working-directory: src
        run: |
          python run_experiment.py \
            ${{ inputs.date && format('--date {0}', inputs.date) || '' }}

      # 第3観測層 prompt_marketing の Gemini(2026-10-01)。実験の観測が**終わってから**同じジョブで走る。
      # 2026-10-17〜21 は日次・週次と同時に一時停止。**2026-10-22 から一時停止の対象外**(config/observation_pause.yaml の exempt・本田さん決定)。
      # その日の実消費(日次・月次・実験・同日の marketing。再試行込み)を数え、20 からの残りが
      # 3回以上の日だけ、1本1回で残りの本数まで投げる。毎月1〜14日のほかは何もしない
      # (15日以降の最初の回だけ、終わらなかった分を quota_skipped として記録する)。
      # 実験の観測が失敗した日は走らない(実消費が数えきれないため)。
      # 2026-10-03 から is_first / mention_rank の Haiku 抽出は停止中(費用削減)。再開は変数 MARKETING_RANK_ENABLED='1'
      - name: Run prompt_marketing (Gemini) within the day's remaining quota
        id: marketing
        working-directory: src
        env:
          MARKETING_RANK_ENABLED: ${{ vars.MARKETING_RANK_ENABLED }}
        run: |
          python run_marketing.py --model gemini ${{ inputs.date && format('--date {0}', inputs.date) || '' }}

      # 実験日誌(欠測の記録)は観測が失敗した日ほど必要なので always() で commit する。
      - name: Commit experiment raw answers and journal
        id: commit
        if: always()
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/raw/experiment data/experiment_journal.csv
          # prompt_marketing の raw と、実験の PerDay 欠測で止めたときの日誌の記録
          if [ -d data/raw/marketing ]; then git add data/raw/marketing; fi
          git add output/reports/experiment47_diary.md
          if [ -d data/claude_usage ]; then git add data/claude_usage; fi  # Claude の1日の呼び出し回数
          if git diff --cached --quiet; then
            echo "No new experiment answers to commit."
          else
            git commit -m "data: experiment observations $(TZ=Asia/Tokyo date +%Y-%m-%d)"
            # 日次・月次の push と重なった場合に備えて取り込んでから送る
            git pull --rebase
            git push
          fi

      # Claude API の1日の呼び出し上限・クレジット不足(claude_budget。2026-10-03)。
      # 止まっていたら失敗にして Slack に知らせる(記録の commit のあと。Gemini の観測には影響しない)。
      - name: Check Claude daily cap
        id: claude_cap
        if: always()
        working-directory: src
        run: python claude_budget.py --check --job experiment --job marketing_gemini

      - name: Notify Slack on workflow failure
        if: failure() && env.SLACK_WEBHOOK_URL != ''
        env:
          # 原因の1行(run_experiment.py が引用符・改行を除いて渡す。2026-10-16)。
          # 以前は「503の欠測・認証エラー・例外」と3つ並べるだけで、どれが起きたか分からなかった
          FAILED_DETAIL: ${{ steps.observe.outputs.failed_detail }}
          OBSERVE: ${{ steps.observe.outcome }}
          MARKETING: ${{ steps.marketing.outcome }}
          COMMIT: ${{ steps.commit.outcome }}
          CLAUDE_CAP: ${{ steps.claude_cap.outcome }}
        run: |
          RUN_URL="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          # 429(枠切れ)だけの欠測は run_experiment が exit 0 にするので、ここには来ない。
          # 原因は落ちたステップごとに1行ずつ。観測のステップは run_experiment.py が書いた原因を出す
          CAUSES=""
          add() { CAUSES="$CAUSES\n• 原因: $1"; }
          if [ "$OBSERVE" = "failure" ]; then
            add "${FAILED_DETAIL:-観測の途中でコードの例外(原因の記録なし・実行ログを参照)}"
          fi
          if [ "$MARKETING" = "failure" ]; then add "prompt_marketing(Gemini)のステップが失敗"; fi
          if [ "$COMMIT" = "failure" ]; then add "記録の commit(git push)が失敗"; fi
          if [ "$CLAUDE_CAP" = "failure" ]; then add "Claude の1日の上限・クレジット不足(claude_budget --check)"; fi
          if [ -z "$CAUSES" ]; then add "準備のステップ(checkout・pip install など)が失敗"; fi
          TEXT="*LLMO実験アラート*\n*❌ ワークフロー失敗*\n• experiment.yml が異常終了しました$CAUSES\n<$RUN_URL|実行ログを開く>"
          printf '{"text":"%s"}' "$TEXT" > payload.json
          curl -sS -X POST -H 'Content-type: application/json' \
            --data @payload.json "$SLACK_WEBHOOK_URL" > /dev/null
