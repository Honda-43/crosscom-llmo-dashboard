# Local dashboard display settings (Phase 4). No credentials here.
[server]
# headless=true also suppresses the first-run email prompt, which would
# otherwise wait for input and stall run_dashboard.bat. The launcher
# opens the browser itself.
headless = true
port = 8501

[browser]
gatherUsageStats = false

[theme]
base = "light"
primaryColor = "#4c78a8"
