# Claude API の1日の呼び出し上限(2026-10-03・本田さん決定)。src/claude_budget.py が読む。

# **計画的停止(2026-10-06・費用ゼロ方針・本田さん決定)**:この日(JST)から Claude を一切呼ばない(上限0)。
# 実験・日次・月次の Claude 観測、Haiku の抽出・順位抽出、週次所見、引用プローブのすべて。
# 停止中の Claude の観測は行を作らない(欠測ではない)。抽出は「抽出保留」(data/extract_pending)、
# 週次所見は数値の表だけで出す。**再開は null にするだけ**(下の上限がそのまま効く)
planned_stop_from: "2026-10-06"
#
# 自動チャージは使わない。上限と「クレジット不足(400)での即停止」で請求の暴走を防ぐ。
# 数えるのは Claude API へのリクエスト1回(再試行も1回。Web 検索つきの観測も Haiku の抽出も週次所見も1回)。
# 1日は JST。ワークフローごとに data/claude_usage/<日付>/<ジョブ>.json に数えて commit し、
# 後から走るジョブは先に走ったジョブの回数を origin から読んで足す。
# 上限に達したら、その日の残りの Claude 呼び出しは投げずに error=daily_cap として記録し、
# ワークフローの最後の「Claude の上限の確認」で実行を失敗扱いにする(Slack に通知が届く)。
#
# **値を変えるときは README の「Claude API の呼び出し上限」の節に日付と理由を書いてから変える。**
# 一時的に上げたいとき(手動の取り直しなど)は環境変数 CLAUDE_DAILY_CAP で上書きできる(その実行だけ)。

# 実験の Claude の日(2026-10-05 から月曜のみ):46本 + E37 = 47回、週次所見 最大2回(切れたら1回だけ取り直す)、
# 残りは再試行の余裕
experiment_day: 60

# それ以外の日:日次(火・木・土)の Claude 7本 + Haiku の抽出 14回(Gemini・Claude の回答7本ずつ)= 21回、
# 残りは再試行の余裕。日次の無い日はほぼ0回
other_day: 30

# 月次の日(第1水・第1木)に足す:月次の Claude 6本 + Haiku の抽出 12回 = 18回 + 再試行の余裕。
# 第1木曜は日次と重なる(7 + 14 + 6 + 12 = 39回)ので、足し算にしている
monthly_batch_extra: 25

# prompt_marketing の Claude または順位の抽出(Haiku)を再開した月の1〜14日に足す
# (2026-10-03 から両方とも停止中なので、今は足さない)。57本 + Haiku 最大57回 + 再試行の余裕
marketing_extra: 130
