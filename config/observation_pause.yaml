# 日次・月次・週次の観測と配信の一時停止(2026-10-17 から・同日決定・ダッシュボードの再設計のため・本田さん決定)。
# src/settings.py の observation_paused() が読む。
#
# 止めるもの(paused_from の日(JST)から):
#   - 日次観測7本(daily.yml の LLM 観測。火・木・土)と、毎日の結果の Slack 配信
#   - 月次観測12本(monthly.yml。第1水・第1木)
#   - 週次所見の生成と配信(weekly.yml の run_weekly.py。Ahrefs・ルール・所見・Slack)
#   - 第3観測層 prompt_marketing の Gemini(experiment.yml の中で実験のあとに走る分)
# 止めないもの:
#   - 実験観測46本(+ watch の E37。experiment.yml)と、その失敗時の Slack 通知
#   - GA4・GSC の収集(daily.yml。無料で、後から遡って取れないため)と、daily.yml の失敗通知
#   - 週次の実験の付随処理(drift_check・実験の週次集計・503欠測/観測本数の行)
#   - 実験日誌・interventions.csv の記録
#
# 停止中の実験の Gemini は毎日14本・予備6本(週98本。settings.EXPERIMENT_PAUSE_DAILY_CAP)。
# 日次・月次が無いので7日とも同じ配分になる。
#
# **再開のしかた:paused_until に停止の最後の日(再開日の前日)を入れる。paused_from は消さない。**
# 実験の巡回の位置(experiment_cursor)は開始日から毎日の本数を足し上げて決めるので、
# paused_from を消すと停止中の日の本数が16/11本に戻り、過去の割当が丸ごとずれる。
# 再開の日には火・木・土が11本(予備2)に戻り、14本×7日の前提が崩れる(週89本で92本を割る)。
# **再開前に実験の配分を決め直すこと**(README「観測と配信の一時停止」)。
paused_from: "2026-10-17"
paused_until: null
