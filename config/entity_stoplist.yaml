# 企業名ではない表現の除外リスト(Phase 1)
#
# LLMが「競合企業」として挙げたものの、実際には企業名ではない一般名詞・
# 説明句を集計から除外する。normalize_entity() による正規化の**後**に適用され、
# 照合は大文字小文字と空白を無視する(YAML側の表記も同じ正規化を通す)。
#
# 追加時の原則:
#   - まず exact に足す。誤爆がなく安全。
#   - contains は「その語を含む企業名は実在しない」と言い切れる場合のみ。
#     部分一致なので、実在社名を巻き込むと観測が黙って消える。

# --- 完全一致で除外 -------------------------------------------------------
exact:
  # 観測データに実際に現れた説明句
  - ブティック型DXコンサルティングファーム
  - ブティック型コンサルティングファーム
  - ブティックコンサルティングファーム
  - ブティックファーム
  - ブティックコンサル
  - ブティック企業
  # 業種・カテゴリの総称
  - コンサルティングファーム
  - コンサルティング会社
  - コンサルファーム
  - 総合コンサルティングファーム
  - 大手コンサルティングファーム
  - 外資系コンサルティングファーム
  - 大手SIer
  - 国内SIer
  - SIer
  - システムインテグレーター
  - システムインテグレータ
  - 開発会社
  - 支援会社
  - 導入支援会社
  - パートナー企業
  - 認定パートナー
  - 専門ベンダー
  - 特定ベンダー
  - ベンダー
  - ベンダー各社
  - 各社
  - 大手各社
  - その他
  - その他多数
  - 不明
  - なし
  - 該当なし
  - N/A
  # 回答内の見出し・説明句が企業名として抽出されたもの(実観測)
  - 会社概要
  - まとめ
  - まとめると
  - 注意点
  - 重要な注意点
  - 選定のポイント
  - 会社選定のポイント
  - 会社選びのポイント
  - コンサルティング会社選定のポイント
  - おすすめの進め方
  - 導入や設計を支援してくれる会社
  - 導入や設計を支援する会社
  - 主な企業
  - 主なプレイヤー
  - おすすめ会社
  - 支援会社一覧
  - 提案するツールの幅
  # 法人格だけが残った断片(除去すると空になるため正規化側では消せない)
  - 株式会社
  - 合同会社
  - 有限会社
  - (株)

# --- 部分一致で除外(慎重に運用) -----------------------------------------
contains:
  - コンサルティングファーム
  - コンサルファーム
  - ブティック
  - SIer
  - 年創業          # 「2018年創業」等、社名ではなく説明の断片
  # 日本語の文の断片。登記社名には現れない語形のみを列挙する
  - してくれる会社
  - ている企業
  - のポイント
  - 比較実績
