# 取り下げた掲載先URL(Phase 7 / A-011)
#
# 旧事業の情報が載っていたページを削除・更新したあと、**AIが引用をやめるまでに
# どれだけかかるか**を実測するための定義。
#
# ページを消しても、モデルのインデックスやグラウンディングは古い参照を
# しばらく持ち続ける。「直したのに所見が変わらない」の原因がここなのか、
# それとも直しが足りないのかを区別できないと、次の打ち手を決められない。
#
# 日次で E-1 の引用URLと突き合わせ、ここに載っているURLが引用された回数を
# lk_events に「削除済みURLの引用」として記録する(src/retired_urls.py)。
#
# status
#   deleted  … URLそのものが 404。引用され続けていれば参照面が古いまま
#   replaced … URLは生きているが中身を現行事業に差し替えた。
#              引用されること自体は害にならないので、区別して数える
#
# 引用が0になった日が「参照面が入れ替わった日」。そこまでの日数がラグ。
retired:
  - url: "https://prtimes.jp/main/html/rd/p/000000003.000132405.html"
    label: "PR TIMES リリース(5万円でコンテンツ企画・制作)"
    retired_on: "2026-09-01"
    action_id: "A-011"
    status: deleted
    # 2026-09-01 に HTTP 404 を確認。
    # 旧事業(MA・CRM運用支援 / 中小企業向けコンテンツ制作代行)の記述。

  - url: "https://prtimes.jp/main/html/rd/p/000000001.000132405.html"
    label: "PR TIMES リリース(月額1万円のマーケティング相談し放題)"
    retired_on: "2026-09-01"
    action_id: "A-011"
    status: deleted
    # 2026-09-01 に HTTP 404 を確認。
    # 旧事業(中小零細企業向けマーケティング支援)の記述。

  - url: "https://prtimes.jp/main/html/searchrlp/company_id/132405"
    label: "PR TIMES 企業ページ"
    retired_on: "2026-09-01"
    action_id: "A-011"
    status: replaced
    # **このURLは削除されていない(2026-09-01 時点で HTTP 200)。**
    # 企業ページは掲載記事の入れ物なので、リリースを消しても残る。
    # ただし中身は現行事業に更新済みで、「プレスリリース 0」になっている:
    #   「Salesforce Agentforceの導入・定着支援と、Agentic CRMの設計支援を行う
    #     …コンサルティング会社です」
    # したがって引用されても旧事業の情報は入らない。削除済み2本と同じ数え方を
    # すると「まだ古い参照が残っている」と誤読するため status を分けている。
