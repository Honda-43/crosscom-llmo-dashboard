# 取り下げた掲載先URL(Phase 7 / A-011)
#
# 旧事業の情報が載っていたページを削除・更新したあと、**AIが引用をやめるまでに
# どれだけかかるか**を実測するための定義。
#
# ページを消しても、モデルのインデックスやグラウンディングは古い参照を
# しばらく持ち続ける。「直したのに所見が変わらない」の原因がここなのか、
# それとも直しが足りないのかを区別できないと、次の打ち手を決められない。
#
# 日次で E-1 の引用URLと突き合わせ、ここに載っているURLが引用された回数を
# lk_events に「削除済みURLの引用」として記録する(src/retired_urls.py)。
#
# status
#   deleted  … URLそのものが 404。引用され続けていれば参照面が古いまま
#   replaced … URLは生きているが中身を現行事業に差し替えた。
#              引用されること自体は害にならないので、区別して数える
#   dead     … サイトごと停止していて到達できない。**こちらから直せない。**
#              deleted と違い「消した結果」ではないので、
#              引用が止まるまでの日数だけを測る(打ち手は先方依頼のみ)
#
# 引用が0になった日が「参照面が入れ替わった日」。そこまでの日数がラグ。
