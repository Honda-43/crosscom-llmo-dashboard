# エンティティ名エイリアス定義(Phase 1 §2-1)
#
# key   = 正規化後の代表表記(sov_daily.entity に記録される名前)
# value = そのキーに統合する表記ゆれのリスト
#
# 照合は normalize_entity() の正規化(NFKC・法人格除去・中黒/スペース統一)を
# 通したうえで大文字小文字を無視して行う。したがって
# 「株式会社メンバーズ サースプラスカンパニー」「メンバーズ・サースプラスカンパニー」
# のような揺れは個別に列挙しなくてもよい。
#
# 運用中に新しい表記ゆれを見つけたら、このファイルに追記するだけでよい
# (コード変更は不要)。未知の企業名は正規化のみ適用してそのまま記録される。
aliases:
  クロスコム: [cross-com, Crosscom, CROSSCOM]
  メンバーズ: [メンバーズ サースプラスカンパニー]
  三菱総研DCS: [DCS, 三菱総研ＤＣＳ]
  # 観測データ上は「株式会社100（100inc）」「株式会社100 (100 Inc.)」と併記される。
  # 法人格を取ると数字だけが残るため、法人格付きの表記も明示的に登録しておく。
  ゼロワングロース: [01GROWTH, 100inc, 100 Inc, 株式会社100]
  日立ソリューションズ: []
  テクノデジタルコンサルティング: []
  船井総合研究所: [船井総研]
  # 「Uhuru」「uhuru」は株式会社ウフルの英語表記(同一企業)。
  # 観測データには英名と和名を併記した「Uhuru 株式会社ウフル」も現れる。
  ウフル: [Uhuru, Uhuru 株式会社ウフル]
  # 「EY ストラテジー…」との空白ゆれは正規化で吸収されるが、
  # 代表表記を固定するためエイリアスとしても明示しておく
  EYストラテジーアンドコンサルティング: [EYストラテジー・アンド・コンサルティング, EY Strategy and Consulting]
