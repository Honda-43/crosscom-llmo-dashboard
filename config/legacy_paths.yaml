# 終了事業のURLパス定義(Phase 2 R-P8)
#
# E-1(エンティティ質問)の回答でこれらのURLが引用されている場合、
# LLMが現在の事業ではなく終了事業の情報を根拠にしている疑いがある。
#
# 判定は「引用URLにこの文字列が含まれるか」の部分一致。
# 新しい終了事業パスを見つけたら追記するだけでよい(コード変更不要)。
#
# ------------------------------------------------------------------
# 2026-08-24 改訂 — 事業3区分にもとづき、現行事業のパスを対象から外した
#
# ここに載せてよいのは【終了事業】のパスだけ。
# 現行事業のページが引用されること自体は汚染ではないため、載せない。
#
#   【注力事業】       Agentforce導入・定着支援 / Agentic CRM設計支援
#   【現行・非注力事業】BtoB Salesforce導入・構築支援 /
#                       BtoB MA導入・構築支援 / メールマーケティング支援
#   【終了事業】       BtoB マーケティング戦略コンサルティング支援 /
#                       MA・メール配信の「代行・運用」
#
# 分かれ目は語ではなく形態。「導入・構築」なら現行、「代行・運用」なら終了。
# 詳細は README「判定基準の変更履歴」と config/playbook.md の P-7 / P-8。
# ------------------------------------------------------------------
paths:
  # BtoB マーケティング戦略コンサルティング支援(終了事業)。
  # 実ページは /service/btob-marketing-strategy/ で、部分一致で拾える。
  # 2026-08-24 に本文を過去形化し、現行サービスへの導線を冒頭に追加済み。
  - /btob-marketing-strategy/

  # 実在しないパス(2026-08-24 に HTTP 404 を確認)。
  # WordPress の page/post を全件走査しても存在せず、AIが実在しないURLを
  # 引用していた=ハルシネーション。実害の検知は続けたいので定義に残す。
  - /btob-crm/

  # メールマーケティング「運用代行」の記事(終了事業)。2026-09-01 の共起監査で発見。
  # 現在は HTTP 404 だが、削除前の実物が Wayback に残っている:
  #   2026-06-09 時点のタイトル
  #   「【2026年最新】メールマーケティング運用代行支援に強い企業11選」
  # スラッグは "support-company" で【現行・非注力】のメールマーケティング支援に
  # 見えるが、中身は「運用代行」であり終了事業にあたる。**パスの字面ではなく
  # 実際の記述で区分すること。**
  # ページを消しても gemini のグラウンディングは引用を続けており、
  # 2026-07-08〜08-31 の E-1 で6回引用されていた。削除=解決ではないため検知を続ける。
  - /email-marketing-support-company/

# --- 2026-08-24 に除外したパス(再追加しないこと) --------------------
# 下記は【現行・非注力事業】のページであり、引用されても汚染ではない。
# R-P8 が実態のない発火を続ける原因になっていたため対象から外した。
#
#   - /marketing-automation-btob/   BtoB MA導入・構築支援(現行)
#   - /ma-tool/                     同上(現行)
#   - /mail-magazine/               メールマーケティング支援(現行・受動対応)
#
# これらのページで「代行・運用」を現在形で訴求している記述が見つかった場合は、
# パスを戻すのではなく、ページ側の文言を直す。パスは事業区分の定義であって、
# 個別ページの文言の良し悪しを表すものではない。
